<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPPG Cilacap Cilacap Selatan Tambakreja 2</title>
<style>
:root{--navy:#123b67;--blue:#2468a6;--bg:#f3f6fa;--ink:#172b42;--muted:#718096;--line:#e4eaf1;--white:#fff;--green:#18845b;--amber:#a66a12;--red:#b83b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif}
.layout{display:flex;min-height:100vh}.side{width:245px;background:#102f50;color:white;padding:22px 15px;flex-shrink:0}.brand{font-size:18px;font-weight:800;letter-spacing:.3px;padding:5px 10px 24px}.brand small{display:block;color:#a9c4df;font-size:10px;letter-spacing:1.5px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#d5e2ef;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:13px}.nav button.active,.nav button:hover{background:#214c75;color:#fff}.nav .section{font-size:10px;color:#8faac4;padding:18px 12px 5px;letter-spacing:1.2px}.main{flex:1;min-width:0}.top{height:65px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top small{color:var(--muted)}.content{padding:26px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px}.pagehead h1{font-size:23px;margin:0 0 4px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.cols{grid-template-columns:1.25fr .75fr}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 2px 7px #17395b08}.card h3{font-size:15px;margin:0 0 14px}.statlabel{font-size:12px;color:var(--muted)}.stat{font-size:27px;font-weight:750;margin-top:5px}.statnote{font-size:11px;color:var(--muted);margin-top:3px}.btn{border:0;border-radius:8px;padding:9px 13px;background:var(--blue);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:#eaf1f8;color:var(--navy)}.btn.ghost{background:white;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:650;color:#465a70}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e1eb;border-radius:8px;padding:10px;background:white;color:var(--ink);font:inherit}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.formgrid .wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#718096;background:#f8fafc;font-weight:650}td,th{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}.pill{display:inline-block;border-radius:30px;padding:3px 8px;font-size:10px;background:#eaf1f8;color:#315b83}.pill.good{background:#e5f5ee;color:var(--green)}.pill.warn{background:#fff4df;color:var(--amber)}.result{background:#edf5fc;border:1px solid #d7e7f6;border-radius:11px;padding:14px;margin:12px 0}.result strong{font-size:26px;color:var(--navy)}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:var(--muted)}.bar{height:8px;background:#edf1f5;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#3c83bd}.autocomplete-wrap{position:relative}.suggestions{position:absolute;z-index:5;top:100%;left:0;right:0;background:#fff;border:1px solid #d8e1eb;border-radius:8px;box-shadow:0 8px 20px #17395b18;max-height:220px;overflow:auto}.suggestions button{display:block;width:100%;text-align:left;background:white;border:0;border-bottom:1px solid #edf1f5;padding:10px 12px;cursor:pointer;color:var(--ink)}.suggestions button:hover{background:#edf5fc}.suggestions small{display:block;color:var(--muted);font-size:11px}.recipe-row{display:grid;grid-template-columns:1fr 100px 80px 30px;gap:8px;align-items:center;margin-bottom:8px}.recipe-row input,.recipe-row select{min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.toast{position:fixed;right:20px;bottom:20px;background:#153c60;color:white;padding:12px 16px;border-radius:9px;display:none;z-index:10}.mobile{display:none}
@media(max-width:850px){.side{width:195px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 18px}}
@media(max-width:600px){.layout{display:block}.side{width:100%;padding:12px}.brand{padding:3px 7px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.nav .section{display:none}.top{height:50px}.content{padding:14px}.stats{gap:9px}.card{padding:14px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.pagehead{display:block}.pagehead .actions{margin-top:12px}.recipe-row{grid-template-columns:1fr 75px 65px 25px}}
</style>
</head>
<body>
<div class="layout">
<aside class="side"><div class="brand">🍽 SPPG CILACAP CILACAP SELATAN TAMBAKREJA 2<small>SPPG MANAGEMENT SYSTEM</small></div>
<nav class="nav" id="nav">
<div class="section">WORKSPACE</div>
<button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button>
<button data-page="planner">▤ &nbsp; Perencanaan Produksi</button>
<button data-page="recipes">▧ &nbsp; Database Resep</button>
<div class="section">MONITORING</div>
<button data-page="history">◷ &nbsp; Riwayat Produksi</button>
<button data-page="evaluation">♡ &nbsp; Evaluasi Menu</button>
<button data-page="waste">♧ &nbsp; Food Waste</button>
<button data-page="recommend">★ &nbsp; Rekomendasi Menu</button>
<div class="section">DATA & ADMIN</div>
<button data-page="reports">⇩ &nbsp; Laporan & Data</button>
<button data-page="users">♙ &nbsp; Pengguna & Akses</button>
</nav></aside>
<main class="main"><header class="top"><div><b id="crumb">Dashboard</b><br><small>Perencanaan bahan baku & evaluasi menu MBG</small></div><div><span class="pill good">● Prototipe lokal</span></div></header>
<div class="content" id="app"></div></main></div><div class="toast" id="toast"></div>
<script>
const KEY='mbg-smart-kitchen-v1';
const demo={
recipes:[
{id:1,name:'Ayam Goreng Malaysia',category:'Ayam',portion:80,ingredients:[['Ayam mentah',80,'gram'],['Tepung terigu',15,'gram'],['Tepung maizena',5,'gram'],['Bawang putih',3,'gram'],['Bumbu lainnya',5,'gram']],notes:'Contoh resep awal. Validasi gramasi oleh Ahli Gizi sebelum digunakan.'},
{id:2,name:'Telur Balado',category:'Telur',portion:1,ingredients:[['Telur ayam',1,'butir'],['Cabai merah',8,'gram'],['Bawang merah',5,'gram'],['Tomat',10,'gram']],notes:'Contoh data, sesuaikan dengan resep aktual.'},
{id:3,name:'Tumis Buncis Wortel',category:'Sayur',portion:70,ingredients:[['Buncis',45,'gram'],['Wortel',25,'gram'],['Bawang putih',2,'gram']],notes:'Contoh data, sesuaikan dengan resep aktual.'}
],productions:[],evaluations:[],wastes:[],users:[{name:'Kepala SPPG',role:'Admin'},{name:'Ahli Gizi',role:'Ahli Gizi'},{name:'Bagian Dapur',role:'Dapur'}]
};
let db=load(),page='dashboard',plan=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch(e){return structuredClone(demo)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(n){return Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2})}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({dashboard:'Dashboard',planner:'Perencanaan Produksi',recipes:'Database Resep',history:'Riwayat Produksi',evaluation:'Evaluasi Menu',waste:'Food Waste',recommend:'Rekomendasi Menu',reports:'Laporan & Data',users:'Pengguna & Akses'})[p];render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function shell(title,sub,body,actions=''){document.getElementById('app').innerHTML=`<div class="pagehead"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions">${actions}</div></div>${body}`}
function render(){({dashboard,planner,recipes,history,evaluation,waste,recommend,reports,users})[page]()}
function dashboard(){let total=db.productions.length,evals=db.evaluations,avg=evals.length?evals.reduce((a,x)=>a+x.like,0)/evals.length:0,waste=db.wastes.reduce((a,x)=>a+x.kg,0);shell('Dashboard','Ringkasan aktivitas dan performa dapur SPPG',`
<div class="grid stats">
<div class="card"><div class="statlabel">Database resep</div><div class="stat">${db.recipes.length}</div><div class="statnote">Menu tersimpan</div></div>
<div class="card"><div class="statlabel">Produksi tercatat</div><div class="stat">${total}</div><div class="statnote">Riwayat produksi</div></div>
<div class="card"><div class="statlabel">Rata-rata kesukaan</div><div class="stat">${evals.length?num(avg)+'%':'—'}</div><div class="statnote">Dari ${evals.length} evaluasi</div></div>
<div class="card"><div class="statlabel">Food waste tercatat</div><div class="stat">${num(waste)} kg</div><div class="statnote">Total catatan sisa</div></div>
</div>
<div class="grid cols"><div class="card"><h3>Produksi terbaru</h3>${db.productions.length?`<table><tr><th>Tanggal</th><th>Menu</th><th>Penerima</th><th>Status</th></tr>${db.productions.slice(-5).reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.menu)}</td><td>${num(p.people)}</td><td><span class="pill">${esc(p.status||'Tercatat')}</span></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada riwayat produksi. Mulai dari Perencanaan Produksi.</div>'}</div>
<div class="card"><h3>Mulai cepat</h3><p class="muted">Pilih menu dan jumlah penerima manfaat untuk menghitung kebutuhan bahan baku.</p><button class="btn" onclick="go('planner')">Buat perencanaan →</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Catatan sistem</h3><p class="muted">Resep contoh masih perlu divalidasi. Masukkan data aktual SPPG agar rekomendasi dan analisis menjadi bermakna.</p></div></div>`)}
function planner(){shell('Perencanaan Produksi','Cari menu dengan mengetik nama, lalu pilih kategori dan jumlah penerima manfaat',`
<div class="grid cols"><div class="card"><h3>Parameter produksi</h3>
<div class="field"><label>Nama menu</label><div class="autocomplete-wrap"><input id="planMenuSearch" autocomplete="off" placeholder="Ketik nama menu, misalnya Ayam Goreng..." oninput="searchPlanMenus()" onfocus="searchPlanMenus()"><div id="planSuggestions" class="suggestions hidden"></div></div></div>
<div class="field"><label>Kategori menu</label><select id="planCategory" onchange="filterPlanMenus()"><option value="">Semua kategori</option>${menuCategories().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
<div class="field"><label>Tanggal produksi</label><input id="planDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Jumlah penerima manfaat</label><input id="planPeople" type="number" min="1" value="3000"></div>
<div class="field"><label>Cadangan bahan (%)</label><input id="planBuffer" type="number" min="0" max="100" value="0"></div>
<input type="hidden" id="planRecipeId">
<div id="selectedMenuHint" class="muted" style="font-size:12px;margin-bottom:10px">Belum ada menu dipilih.</div>
<button class="btn" onclick="calculate()">Hitung kebutuhan bahan</button></div>
<div class="card"><h3>Hasil kalkulasi</h3><div id="planResult" class="empty">Ketik nama menu, pilih hasil dari database, lalu tekan Hitung.</div></div></div>`)}
function menuCategories(){return [...new Set(db.recipes.map(r=>r.category||'Lainnya'))].sort()}
function searchPlanMenus(){let q=document.getElementById('planMenuSearch').value.toLowerCase().trim(),cat=document.getElementById('planCategory').value,box=document.getElementById('planSuggestions');let matches=db.recipes.filter(r=>(!cat||r.category===cat)&&(!q||r.name.toLowerCase().includes(q))).slice(0,12);box.innerHTML=matches.length?matches.map(r=>`<button type="button" onclick="selectPlanMenu(${r.id})"><b>${esc(r.name)}</b><small>${esc(r.category||'Lainnya')} · ${r.ingredients.length} bahan</small></button>`).join(''):'<div style="padding:12px;color:#718096">Menu tidak ditemukan. Tambahkan terlebih dahulu di Database Resep.</div>';box.classList.remove('hidden')}
function filterPlanMenus(){let chosen=document.getElementById('planMenuSearch').value;document.getElementById('planRecipeId').value='';document.getElementById('selectedMenuHint').textContent='Pilih menu dari daftar prediksi.';searchPlanMenus()}
function selectPlanMenu(id){let r=db.recipes.find(x=>x.id===id);if(!r)return;document.getElementById('planMenuSearch').value=r.name;document.getElementById('planCategory').value=r.category||'';document.getElementById('planRecipeId').value=r.id;document.getElementById('planSuggestions').classList.add('hidden');document.getElementById('selectedMenuHint').textContent='Menu dipilih: '+r.name+' · Kategori: '+(r.category||'Lainnya')}
function calculate(){let r=db.recipes.find(x=>x.id==document.getElementById('planRecipeId').value),people=+document.getElementById('planPeople').value,buffer=+document.getElementById('planBuffer').value,date=document.getElementById('planDate').value;if(!r||people<=0||buffer<0){toast('Periksa menu dan jumlah penerima.');return}let rows=r.ingredients.map(i=>{let raw=i[1]*people*(1+buffer/100),unit=i[2];return {name:i[0],qty:raw,unit,display:unit==='gram'?num(raw/1000)+' kg':unit==='ml'?num(raw/1000)+' liter':num(raw)+' '+unit}});plan={recipe:r,people,buffer,date,rows};document.getElementById('planResult').innerHTML=`<div class="result"><div class="muted">Menu: <b>${esc(r.name)}</b></div><strong>${num(people)}</strong><div class="muted">penerima manfaat · cadangan ${buffer}%</div></div><table><tr><th>Bahan baku</th><th>Kebutuhan</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td><b>${x.display}</b></td></tr>`).join('')}</table><p class="muted" style="font-size:11px">Hasil dihitung dari gramasi resep × jumlah penerima × faktor cadangan. Belum termasuk perubahan berat akibat proses masak kecuali sudah dimasukkan ke standar resep.</p><button class="btn" onclick="savePlan()">Simpan sebagai rencana produksi</button>`}
function savePlan(){if(!plan)return;db.productions.push({id:Date.now(),date:plan.date,menu:plan.recipe.name,recipeId:plan.recipe.id,people:plan.people,planned:plan.rows,status:'Rencana'});save();toast('Rencana produksi tersimpan.');go('history')}
function recipes(){shell('Database Resep','Kelola standar gramasi dan komposisi bahan per porsi',`<div class="card"><div class="actions" style="justify-content:space-between;margin-bottom:12px"><b>${db.recipes.length} resep tersimpan</b><button class="btn" onclick="recipeForm()">+ Tambah resep</button></div><table><tr><th>Nama menu</th><th>Kategori</th><th>Jumlah bahan</th><th>Aksi</th></tr>${db.recipes.map(r=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.notes||'')}</span></td><td>${esc(r.category)}</td><td>${r.ingredients.length} bahan</td><td><button class="btn secondary" onclick="recipeForm(${r.id})">Edit</button> <button class="btn danger" onclick="deleteRecipe(${r.id})">Hapus</button></td></tr>`).join('')}</table></div>`)}
function recipeForm(id){let r=db.recipes.find(x=>x.id===id),ings=r?structuredClone(r.ingredients):[['Ayam mentah',80,'gram']];document.getElementById('app').innerHTML=`<div class="pagehead"><div><h1>${r?'Edit resep':'Tambah resep'}</h1><div class="muted">Standar bahan per satu porsi penerima manfaat</div></div><button class="btn ghost" onclick="go('recipes')">Kembali</button></div><div class="card"><div class="formgrid"><div class="field"><label>Nama menu</label><input id="rName" value="${esc(r?.name||'')}"></div><div class="field"><label>Kategori menu</label><select id="rCat">${['Ayam','Telur','Sayur','Ikan','Daging','Lauk lainnya','Lainnya'].map(c=>`<option ${((r?.category)||'Lauk lainnya')===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field wide"><label>Catatan resep</label><textarea id="rNotes">${esc(r?.notes||'')}</textarea></div></div><h3>Komposisi bahan per porsi</h3><div id="ingredientRows">${ings.map(i=>ingredientRow(i)).join('')}</div><button class="btn secondary" onclick="addIngredient()">+ Tambah bahan</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn" onclick="saveRecipe(${id||0})">Simpan resep</button></div>`}
function ingredientRow(i=['','', 'gram']){return `<div class="recipe-row"><input class="ing-name" placeholder="Nama bahan" value="${esc(i[0])}"><input class="ing-qty" type="number" min="0" step="any" placeholder="Gramasi" value="${i[1]}"><select class="ing-unit"><option ${i[2]==='gram'?'selected':''}>gram</option><option ${i[2]==='ml'?'selected':''}>ml</option><option ${i[2]==='butir'?'selected':''}>butir</option><option ${i[2]==='buah'?'selected':''}>buah</option><option ${i[2]==='ikat'?'selected':''}>ikat</option></select><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addIngredient(){document.getElementById('ingredientRows').insertAdjacentHTML('beforeend',ingredientRow())}
function saveRecipe(id){let name=document.getElementById('rName').value.trim(),category=document.getElementById('rCat').value.trim(),ingredients=[...document.querySelectorAll('.recipe-row')].map(x=>[x.querySelector('.ing-name').value.trim(),+x.querySelector('.ing-qty').value,x.querySelector('.ing-unit').value]).filter(x=>x[0]&&x[1]>0);if(!name||!ingredients.length){toast('Nama menu dan minimal satu bahan wajib diisi.');return}let item={id:id||Date.now(),name,category,ingredients,notes:document.getElementById('rNotes').value};let idx=db.recipes.findIndex(x=>x.id===id);if(idx>=0)db.recipes[idx]=item;else db.recipes.push(item);save();toast('Resep tersimpan.');go('recipes')}
function deleteRecipe(id){if(confirm('Hapus resep ini? Riwayat produksi yang sudah ada tidak ikut dihapus.')){db.recipes=db.recipes.filter(x=>x.id!==id);save();recipes()}}
function history(){shell('Riwayat Produksi','Catatan rencana dan realisasi produksi',`<div class="card"><table><tr><th>Tanggal</th><th>Menu</th><th>Penerima</th><th>Status</th><th>Aksi</th></tr>${db.productions.length?db.productions.slice().reverse().map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.menu)}</td><td>${num(p.people)}</td><td><span class="pill">${esc(p.status)}</span></td><td><button class="btn secondary" onclick="actualForm(${p.id})">Input aktual</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada data produksi.</td></tr>'}</table></div>`)}
function actualForm(id){let p=db.productions.find(x=>x.id===id);let old=p.actual||[];document.getElementById('app').innerHTML=`<div class="pagehead"><div><h1>Realisasi produksi</h1><div class="muted">${esc(p.menu)} · ${esc(p.date)}</div></div><button class="btn ghost" onclick="go('history')">Kembali</button></div><div class="card"><p>Masukkan jumlah aktual bahan yang digunakan. Gunakan satuan yang sama dengan hasil kalkulasi.</p><table><tr><th>Bahan</th><th>Rencana</th><th>Aktual</th><th>Satuan</th></tr>${p.planned.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.display}</td><td><input type="number" min="0" step="any" id="actual${i}" value="${old[i]?.qty??''}" style="width:100px;padding:7px;border:1px solid var(--line);border-radius:6px"></td><td>${x.unit}</td></tr>`).join('')}</table><div class="field" style="margin-top:15px"><label>Status produksi</label><select id="pStatus"><option>Rencana</option><option ${p.status==='Selesai'?'selected':''}>Selesai</option></select></div><button class="btn" onclick="saveActual(${id})">Simpan realisasi</button></div>`}
function saveActual(id){let p=db.productions.find(x=>x.id===id);p.actual=p.planned.map((x,i)=>({name:x.name,qty:+document.getElementById('actual'+i).value,unit:x.unit}));p.status=document.getElementById('pStatus').value;save();toast('Realisasi disimpan.');go('history')}
function evaluation(){shell('Evaluasi Kesukaan Menu','Catat respons anak-anak berdasarkan survei atau pengamatan terukur',`<div class="grid cols"><div class="card"><h3>Tambah evaluasi</h3><div class="field"><label>Menu</label><select id="eMenu">${db.recipes.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Jumlah responden</label><input id="eTotal" type="number" min="1" value="100"></div><div class="field"><label>Jumlah anak yang menyukai</label><input id="eLike" type="number" min="0" value="85"></div><div class="field"><label>Catatan</label><textarea id="eNotes" placeholder="Contoh: rasa, tekstur, tingkat kepedasan, sekolah"></textarea></div><button class="btn" onclick="saveEvaluation()">Simpan evaluasi</button></div><div class="card"><h3>Riwayat evaluasi</h3>${db.evaluations.length?`<table><tr><th>Menu</th><th>Respon</th><th>Kesukaan</th></tr>${db.evaluations.slice().reverse().map(e=>`<tr><td>${esc(e.menu)}<br><span class="muted">${esc(e.date)}</span></td><td>${e.likeCount}/${e.total}</td><td><b>${num(e.like)}%</b></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada evaluasi.</div>'}</div></div>`)}
function saveEvaluation(){let total=+eTotal.value,likeCount=+eLike.value;if(total<=0||likeCount<0||likeCount>total){toast('Jumlah suka harus antara 0 dan jumlah responden.');return}db.evaluations.push({id:Date.now(),menu:eMenu.value,date:eDate.value,total,likeCount,like:likeCount/total*100,notes:eNotes.value});save();toast('Evaluasi tersimpan.');evaluation()}
function waste(){shell('Analisis Food Waste','Catat sisa makanan dan penyebabnya untuk mengurangi pemborosan',`<div class="grid cols"><div class="card"><h3>Input food waste</h3><div class="field"><label>Menu</label><select id="wMenu">${db.recipes.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input id="wDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Berat sisa (kg)</label><input id="wKg" type="number" min="0" step="0.1"></div><div class="field"><label>Jenis sisa</label><select id="wType"><option>Nasi</option><option>Lauk</option><option>Sayuran</option><option>Lainnya</option></select></div><div class="field"><label>Perkiraan penyebab</label><select id="wCause"><option>Porsi terlalu besar</option><option>Rasa kurang disukai</option><option>Tekstur / tampilan</option><option>Keterlambatan distribusi</option><option>Faktor lainnya</option></select></div><button class="btn" onclick="saveWaste()">Simpan food waste</button></div><div class="card"><h3>Catatan sisa makanan</h3>${db.wastes.length?`<table><tr><th>Tanggal / menu</th><th>Jenis</th><th>Berat</th></tr>${db.wastes.slice().reverse().map(w=>`<tr><td>${esc(w.date)}<br>${esc(w.menu)}<br><span class="muted">${esc(w.cause)}</span></td><td>${esc(w.type)}</td><td>${num(w.kg)} kg</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada catatan.</div>'}</div></div>`)}
function saveWaste(){let kg=+wKg.value;if(kg<0||!Number.isFinite(kg)){toast('Masukkan berat yang valid.');return}db.wastes.push({id:Date.now(),menu:wMenu.value,date:wDate.value,kg,type:wType.value,cause:wCause.value});save();toast('Data food waste tersimpan.');waste()}
function recommend(){let names=[...new Set([...db.recipes.map(r=>r.name),...db.evaluations.map(e=>e.menu)])],rank=names.map(name=>{let es=db.evaluations.filter(e=>e.menu===name),avg=es.length?es.reduce((a,e)=>a+e.like,0)/es.length:null,ws=db.wastes.filter(w=>w.menu===name),w=ws.reduce((a,x)=>a+x.kg,0);return{name,avg,w,count:es.length}}).sort((a,b)=>(b.avg??-1)-(a.avg??-1));shell('Rekomendasi Menu Terbaik','Peringkat berbasis data evaluasi dan food waste yang sudah dicatat',`<div class="card"><p class="muted">Peringkat kesukaan menggunakan rata-rata persentase responden yang menyukai menu. Food waste ditampilkan sebagai indikator tambahan, bukan perbandingan final sebelum jumlah porsi produksi ikut diperhitungkan.</p><table><tr><th>Menu</th><th>Rata-rata kesukaan</th><th>Jumlah evaluasi</th><th>Food waste</th><th>Indikasi</th></tr>${rank.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.avg===null?'Belum ada data':num(x.avg)+'%'}</td><td>${x.count}</td><td>${num(x.w)} kg</td><td>${x.avg===null?'<span class="pill">Perlu evaluasi</span>':x.avg>=85?'<span class="pill good">Sangat disukai</span>':x.avg>=70?'<span class="pill good">Disukai</span>':x.avg>=60?'<span class="pill warn">Cukup</span>':'<span class="pill warn">Perlu perbaikan</span>'}</td></tr>`).join('')}</table></div>`)}
function reports(){shell('Laporan & Data','Ekspor data agar dapat diolah lebih lanjut menggunakan Excel',`<div class="grid cols"><div class="card"><h3>Ekspor data</h3><p class="muted">Unduh masing-masing tabel dalam format CSV yang dapat dibuka di Microsoft Excel.</p><div class="actions"><button class="btn" onclick="exportCSV('recipes')">Ekspor resep</button><button class="btn" onclick="exportCSV('productions')">Ekspor produksi</button><button class="btn" onclick="exportCSV('evaluations')">Ekspor evaluasi</button><button class="btn" onclick="exportCSV('wastes')">Ekspor food waste</button></div></div><div class="card"><h3>Cadangkan / pulihkan database</h3><p class="muted">Backup JSON menyimpan seluruh data prototipe. Simpan file cadangan secara berkala.</p><div class="actions"><button class="btn secondary" onclick="backup()">Unduh backup JSON</button><label class="btn ghost">Impor backup JSON<input type="file" accept=".json,application/json" onchange="restore(event)" hidden></label></div><p class="muted" style="font-size:11px">Impor backup akan mengganti data lokal yang sedang tersimpan.</p></div></div>`)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(type){let arr=db[type]||[],rows;if(type==='recipes')rows=[['Menu','Kategori','Bahan','Jumlah per porsi','Satuan','Catatan'],...arr.flatMap(r=>r.ingredients.map(i=>[r.name,r.category,i[0],i[1],i[2],r.notes]))];else if(type==='productions')rows=[['Tanggal','Menu','Penerima','Status','Bahan','Rencana','Aktual','Satuan'],...arr.flatMap(p=>(p.planned||[]).map((x,i)=>[p.date,p.menu,p.people,p.status,x.name,x.qty,p.actual?.[i]?.qty??'',x.unit]))];else if(type==='evaluations')rows=[['Tanggal','Menu','Responden','Menyukai','Persentase','Catatan'],...arr.map(x=>[x.date,x.menu,x.total,x.likeCount,x.like,x.notes])];else rows=[['Tanggal','Menu','Jenis sisa','Berat kg','Penyebab'],...arr.map(x=>[x.date,x.menu,x.type,x.kg,x.cause])];let blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mbg-'+type+'.csv';a.click();URL.revokeObjectURL(a.href)}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mbg-smart-kitchen-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!d.recipes||!d.productions||!d.evaluations||!d.wastes)throw Error();db=d;save();toast('Backup berhasil dipulihkan.');go('dashboard')}catch(err){toast('File backup tidak valid.')}};rd.readAsText(f)}
function users(){shell('Pengguna & Hak Akses','Contoh struktur peran untuk implementasi multiuser',`<div class="card"><div class="pill warn">Simulasi hak akses — belum ada login sungguhan</div><table style="margin-top:12px"><tr><th>Peran</th><th>Hak akses yang direncanakan</th></tr><tr><td><b>Kepala SPPG</b></td><td>Semua modul, laporan, persetujuan dan pengelolaan akun.</td></tr><tr><td><b>Ahli Gizi</b></td><td>Database resep, standar gramasi, validasi menu, evaluasi gizi.</td></tr><tr><td><b>Bagian Dapur</b></td><td>Melihat rencana produksi, input realisasi bahan dan food waste.</td></tr></table><p class="muted">Versi ini berjalan di satu browser/perangkat. Agar beberapa orang dapat memakai data yang sama, diperlukan backend, database online, autentikasi dan pengaturan keamanan.</p></div>`)}
render();
</script></body></html>
